name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Build Android APK
        run: |
          # Case A: If Android Gradle project exists directly in repo
          if [ -f "app/build.gradle" ]; then
            echo "==> Building native Android project directly with Gradle..."
            chmod +x ./gradlew 2>/dev/null || true
            gradle assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
            exit 0
          fi

          # Case B: If Web project, compile web and sync to Android
          echo "==> Installing Node & Capacitor dependencies..."
          npm install --force || npm install --legacy-peer-deps
          npm install --force @capacitor/core @capacitor/cli @capacitor/android

          echo "==> Building Web App Dist..."
          npm run build || npx vite build

          echo "==> Setting up Capacitor Android..."
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          echo "==> Compiling Debug APK with Gradle..."
          cd android
          chmod +x ./gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon

      - name: 7. Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-4K-Pro-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
